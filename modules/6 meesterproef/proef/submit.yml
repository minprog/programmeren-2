buttons:
    'mypy': |
        from mypy import api
        print(api.run(['opdracht.py'])[0])
    'pytest': |
        import pytest
        pytest.main(['--color=yes'])
    'pycodestyle': |
        import pycodestyle
        result = pycodestyle.StyleGuide(
            select=[
                'E101',
                'E112',
                'E113',
                'E115',
                'E116',
                'E117',
                'E501',
                'E502',
                'W505',
                'W291'
            ],
            max_line_length=99,
            max_doc_length=79
        ).check_files(['opdracht.py'])

        if result.file_errors == 0:
            print("We ran pycodestyle and it did not give any errors :)")

