        test_python_tutorial.py: |
            from python_tutorial import *

            def test_greet():
                assert greet("Alice") in ["Hello Alice!", "Hallo Alice!"]
                assert "Bob" in greet("Bob")

            def test_describe_temperature():
                assert describe_temperature(5) == "cold"
                assert describe_temperature(20) == "warm"
                assert describe_temperature(35) == "hot"

            def test_print_alternating(capsys):
                print_alternating(6)
                out, _ = capsys.readouterr()
                lines = out.strip().splitlines()
                assert lines == ["odd", "even", "odd", "even", "ping!", "even"]

            def test_collatz(capsys):
                collatz(6)
                out, _ = capsys.readouterr()
                lines = [int(x) for x in out.strip().splitlines()]
                assert lines[0] == 6
                assert lines[-1] == 1
                assert 3 in lines and 16 in lines

            def test_shout():
                assert shout("hello") == "HELLO!"
                assert shout("Python") == "PYTHON!"

            def test_count_a():
                assert count_a("Ananas") == 3
                assert count_a("Banaan") == 3
                assert count_a("XYZ") == 0

            def test_add_item():
                data = [1, 2]
                assert add_item(data, 3) == [1, 2, 3]

            def test_find_largest():
                assert find_largest([3, 1, 4, 1, 5]) == 5
                assert find_largest([-5, -1, -9]) == -1

            def test_average_length():
                assert round(average_length(["python", "is", "fun"]), 2) == 3.67
                assert average_length([]) == 0.0
