_settings:
    start_date: 26/10/26
    end_date: 18/12/26

# Maximum is 48 points: modules up to containers 24 (incl. 2 star points),
# workshops 8, assignments validated in the eindgesprek 16.
# The meesterproef is a requirement with weight 0. It belongs conceptually to
# the modules up to and including containers.
calculation:
    eindcijfer:
        python: 6
        python_ster: 1
        collections: 6
        objects: 2
        adt: 4
        containers: 5
        workshops: 8
        linked: 2
        restricted: 4
        graphs: 10
        meesterproef: 0

startup:
    type: points
    show_overview: true
    submits:
        python_tutorial: 1

python:
    type: points
    maximum: 6  # 14 opdrachten van 0.5 punt, maximaal 6
    show_progress: true
    deadline: 30/10/26 17:00
    submits:
        weken: 0.5
        isalpha: 0.5
        lower: 0.5
        orakel: 0.5
        index: 0.5
        slice: 0.5
        capitalize: 0.5
        title: 0.5
        find: 0.5
        split: 0.5
        calculator: 0.5
        join: 0.5
        replace: 0.5
        camelcase: 0.5

python_ster:
    type: points
    show_progress: true
    deadline: 30/10/26 17:00
    submits:
        kenteken: 0.5
        split_real: 0.5

collections:
    type: points
    show_progress: true
    deadline: 06/11/26 17:00
    submits:
        sets: 1
        dicts: 1
        tuples: 1
        recommend: 2
        big-o-questions: 1

objects:
    type: points
    show_progress: true
    deadline: 13/11/26 17:00
    submits:
        queue: 1
        jar: 1

adt:
    type: points
    show_progress: true
    deadline: 13/11/26 17:00
    submits:
        cards: 2
        card_implementations: 2

containers:
    type: points
    show_overview: true
    deadline: 20/11/26 17:00
    submits:
        war: 2
        dict_implementations: 2
        markov: 1

# Points depend on presence in class and mostly finishing the assignment.
# Each is entered by hand as a single check, so there is no deadline.
workshops:
    type: points
    show_progress: true
    show_overview: true
    submits:
        cc_hangman: 2
        cash_tests: 2
        profiling: 2
        police: 2

# The following three only count after validation in the eindgesprek.
linked:
    type: points
    show_overview: true
    deadline: 20/11/26 17:00
    submits:
        list_implementations: 2

restricted:
    type: points
    show_overview: true
    deadline: 27/11/26 17:00
    submits:
        palindrome: 2
        priority_queue_adt: 2

graphs:
    type: points
    show_overview: true
    deadline: 11/12/26 17:00
    submits:
        adventure-steps: 10

# Fulltime students sit the first meesterproef, parttime students the second.
# A resit is only possible if enough assignments were handed in on time, and
# is agreed between teacher and student.
meesterproef:
    type: pass_any
    show_overview: true
    submits:
        - meesterproef1
        - meesterproef2
